<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="plateShadow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="90%" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Outer Rim Gradient -->
    <radialGradient id="outerRimGrad" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F4F3EE"/>
      <stop offset="95%" stop-color="#E7E5DC"/>
      <stop offset="100%" stop-color="#DCD9CD"/>
    </radialGradient>

    <!-- Inner Well Slope Gradient -->
    <radialGradient id="rimSlopeGrad" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F0E8"/>
      <stop offset="85%" stop-color="#E2DFD3"/>
      <stop offset="100%" stop-color="#D2CEC0"/>
    </radialGradient>

    <!-- Flat Plate Base Gradient -->
    <radialGradient id="baseGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="50%" stop-color="#F3F2EB"/>
      <stop offset="85%" stop-color="#E9E7DC"/>
      <stop offset="100%" stop-color="#DDD9CC"/>
    </radialGradient>

    <!-- Embossed Ring Filter -->
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.9"/>
      <feDropShadow dx="-1" dy="-1.5" stdDeviation="1.2" flood-color="#B8B3A2" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Drop Shadow -->
  <circle cx="400" cy="415" r="370" fill="url(#plateShadow)"/>

  <!-- Outer Plate Body -->
  <circle cx="400" cy="400" r="365" fill="url(#outerRimGrad)" stroke="#D5D1C3" stroke-width="2"/>

  <!-- Outer Rim Edge Highlight & Groove -->
  <circle cx="400" cy="400" r="350" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
  <circle cx="400" cy="400" r="348" fill="none" stroke="#D1CDC0" stroke-width="1.5" opacity="0.6"/>

  <!-- Wide Rim Contour Wall -->
  <circle cx="400" cy="400" r="290" fill="url(#rimSlopeGrad)" stroke="#C8C4B5" stroke-width="1.5"/>

  <!-- Inner Plate Floor / Base -->
  <circle cx="400" cy="400" r="260" fill="url(#baseGrad)" stroke="#D4D0C2" stroke-width="1.2"/>

  <!-- Inner Concentric Steppes & Embossing -->
  <circle cx="400" cy="400" r="248" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.75"/>
  <circle cx="400" cy="400" r="246" fill="none" stroke="#CFCABc" stroke-width="1.2" opacity="0.5"/>

  <!-- Eco Embossed Center Stamp -->
  <g filter="url(#emboss)" opacity="0.4">
    <text x="400" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#9C9686" letter-spacing="4">
      100% BIODEGRADABLE
    </text>
    <text x="400" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#8E8877" letter-spacing="6">
      BRANPLATE
    </text>
    <text x="400" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#A49E8E" letter-spacing="3">
      COMPOSTABLE · PLANT FIBER
    </text>
  </g>

  <!-- Natural Texture Overlay Dots -->
  <circle cx="310" cy="290" r="1.5" fill="#B3AE9E" opacity="0.3"/>
  <circle cx="480" cy="320" r="1.2" fill="#B3AE9E" opacity="0.25"/>
  <circle cx="360" cy="490" r="1.5" fill="#B3AE9E" opacity="0.3"/>
  <circle cx="450" cy="460" r="1.3" fill="#B3AE9E" opacity="0.25"/>
  <circle cx="280" cy="420" r="1.4" fill="#B3AE9E" opacity="0.3"/>
  <circle cx="510" cy="380" r="1.2" fill="#B3AE9E" opacity="0.25"/>
</svg>
